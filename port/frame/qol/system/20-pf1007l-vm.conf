# PF1007L (1 GB, zram swap, root on microSD). /etc/sysctl.d/20-pf1007l-vm.conf
# Swap to compressed RAM early: a page read back from zram costs far less than a file page read
# back from the SD card. Values: the zram profile of the Arch wiki; the dirty limits keep SD write
# bursts short. Estimates, not measured on this frame (E071).
vm.swappiness = 180
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.vfs_cache_pressure = 50
vm.dirty_background_bytes = 4194304
vm.dirty_bytes = 16777216
