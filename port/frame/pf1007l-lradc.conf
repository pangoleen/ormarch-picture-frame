# PF1007L: the A33 key-voltage converter (LRADC0) is the light sensor, not a key input.
# With the mainline key driver loaded, a dark room reads as "volume key held"; the desktop then
# starts its volume script many times a second until memory is full (E064). Keep the driver out
# on every boot label. pf-auto-brightness reads the converter instead.
blacklist sun4i_lradc_keys
