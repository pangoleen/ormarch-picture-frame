# PF1007L /etc/NetworkManager/conf.d/20-pf1007l-wifi-powersave.conf
# The AIC8800 SDIO driver hung for good with Wi-Fi power saving on (E073): its transmit thread waited
# forever on an SDIO read, and every program that touched networking, SSH over USB included, blocked
# behind it. 2 = power saving off.
[connection]
wifi.powersave = 2
