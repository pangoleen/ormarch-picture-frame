# PF1007L /etc/systemd/zram-generator.conf (E077). The default is half of the RAM (489 MB). Measured
# compression on the frame: 168 MB of pages in 58 MB of RAM (2.9 : 1). A swap as large as the RAM lets
# the kernel compress more of the idle pages before it runs out; it costs RAM only for what it holds.
[zram0]
zram-size = ram
compression-algorithm = lzo-rle
swap-priority = 100
