# PF1007L USB gadget settings. Shell syntax: NAME=value, no spaces around "=".
# Read by /usr/lib/pf1007l/pf-gadget (in the initramfs and in the system).
#
# SERIAL=1      serial port (ACM): a login console on the Mac, /dev/cu.usbmodem*
# NET=ncm       network function: ncm (default), ecm, or none
# MAXPOWER=2    current in the USB descriptor, mA
SERIAL=1
NET=ncm
MAXPOWER=2
