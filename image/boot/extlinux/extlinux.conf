# PF1007L boot menu. U-Boot (build L) reads this file from the FAT partition.
# There is no screen and no keyboard at this stage: U-Boot starts DEFAULT at once.
# To choose another label: change the DEFAULT line here (any text editor on the
# Mac), or run on the frame:  pf-bootsel <label>
#
# Bring-up ladder. Go one step down only when the step before gives a USB link.
#   min           first boot: SD card + USB only (no PMIC, display, touch, Wi-Fi in the device tree)
#   pmic          + PMIC, regulators, I2C (display, touch and Wi-Fi still off)
#   full-stage1   the full board device tree (kernel/out), but the display, GPU and Wi-Fi
#                 MODULES do not load by themselves; load them by hand (kernel/README.md, section 12)
#   full          the full board device tree, all modules load by themselves
# Tools:
#   min-noinitrd  as "min", without our initramfs (the USB link comes up later, from systemd)
#   min-shell     as "min", but stops in the initramfs: a root shell on the USB serial port
#
# If a label cannot load its files, U-Boot tries the next labels in this order.
#
# Kernel messages on the USB serial port: add "console=ttyGS0,115200" BEFORE "console=tty0".
# It is not on by default (not tested on the frame; "dmesg" after the login gives the same text).

DEFAULT min
PROMPT 0
TIMEOUT 1

LABEL min
	KERNEL /zImage
	INITRD /pf-initramfs.img
	FDT /dtbs/sun8i-a33-pf1007l-min.dtb
	APPEND root=PARTUUID=@SIG@-02 rootfstype=ext4 rootwait ro console=tty0 ignore_loglevel log_buf_len=1M panic=20 psi=1 zswap.enabled=0 fsck.repair=yes pf.label=min

LABEL pmic
	KERNEL /zImage
	INITRD /pf-initramfs.img
	FDT /dtbs/sun8i-a33-pf1007l-pmic.dtb
	APPEND root=PARTUUID=@SIG@-02 rootfstype=ext4 rootwait ro console=tty0 ignore_loglevel log_buf_len=1M panic=20 psi=1 zswap.enabled=0 fsck.repair=yes pf.label=pmic

LABEL full-stage1
	KERNEL /zImage
	INITRD /pf-initramfs.img
	FDT /dtbs/sun8i-a33-pf1007l-full.dtb
	APPEND root=PARTUUID=@SIG@-02 rootfstype=ext4 rootwait ro console=tty0 ignore_loglevel log_buf_len=1M panic=20 psi=1 zswap.enabled=0 fsck.repair=yes cpufreq.default_governor=schedutil modprobe.blacklist=sun4i_drm,sun4i_tcon,sun4i_backend,sun4i_frontend,sun6i_drc,sun6i_mipi_dsi,sun8i_tcon_top,panel_jadard_jd9365da_h3,lima,aic8800_bsp,aic8800_fdrv,aic8800_btlpm pf.label=full-stage1

LABEL full
	KERNEL /zImage
	INITRD /pf-initramfs.img
	FDT /dtbs/sun8i-a33-pf1007l-full.dtb
	APPEND root=PARTUUID=@SIG@-02 rootfstype=ext4 rootwait ro console=tty0 ignore_loglevel log_buf_len=1M panic=20 psi=1 zswap.enabled=0 fsck.repair=yes cpufreq.default_governor=schedutil pf.label=full

LABEL min-noinitrd
	KERNEL /zImage
	FDT /dtbs/sun8i-a33-pf1007l-min.dtb
	APPEND root=PARTUUID=@SIG@-02 rootfstype=ext4 rootwait ro console=tty0 ignore_loglevel log_buf_len=1M panic=20 psi=1 zswap.enabled=0 fsck.repair=yes pf.label=min-noinitrd

LABEL min-shell
	KERNEL /zImage
	INITRD /pf-initramfs.img
	FDT /dtbs/sun8i-a33-pf1007l-min.dtb
	APPEND root=PARTUUID=@SIG@-02 rootfstype=ext4 rootwait ro console=tty0 ignore_loglevel log_buf_len=1M panic=20 psi=1 zswap.enabled=0 fsck.repair=yes pf.shell pf.label=min-shell
