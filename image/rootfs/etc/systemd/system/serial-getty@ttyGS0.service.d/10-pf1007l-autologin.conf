# Login console on the USB gadget serial port (ttyGS0).
#
# 1. No passwords exist in this image, so the console logs in the user "frame"
#    automatically. Who has the USB cable also has the SD card: this adds no new
#    access. Remove the ExecStart lines to get a normal login prompt.
# 2. TTYReset/TTYVHangup = no. With "yes" (the default of serial-getty@.service),
#    systemd writes a reset sequence to the port BEFORE it starts agetty, and it
#    holds its lock on /dev/console during that write. A gadget serial port with
#    no USB host accepts no data (u_serial: write room is 0), so the write never
#    returns, and each other unit that needs the console lock waits for ever
#    (seen in the QEMU test: systemd-vconsole-setup). With "no", only agetty
#    waits for the host, and nothing else.
# The unit is started by udev when ttyGS0 appears (60-pf1007l-ttygs.rules).
[Service]
TTYReset=no
TTYVHangup=no
TTYVTDisallocate=no
ExecStart=
ExecStart=-/sbin/agetty --autologin frame --noreset --noclear --keep-baud 115200,57600,38400,9600 - xterm-256color
