# AIC8800 Wi-Fi: no automatic load. The chip type and revision of this unit are
# not read yet. Manual step: pf-wifi-check, then pf-wifi-check --load.
# "blacklist" stops only the automatic load (udev); modprobe by hand still works.
blacklist aic8800_bsp
blacklist aic8800_fdrv
blacklist aic8800_btlpm
