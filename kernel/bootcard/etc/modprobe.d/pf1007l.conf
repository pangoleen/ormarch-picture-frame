# /etc/modprobe.d/pf1007l.conf - PF1007L photo frame. DRAFT: not run on the frame.

# Fixed addresses for the USB network link, so that the Mac sees the same interface on
# each boot. These are locally administered addresses made for this project. They are
# not addresses of the frame.
options g_cdc dev_addr=02:50:46:10:07:01 host_addr=02:50:46:10:07:02 iManufacturer=omarchy-frame iProduct=PF1007L-debug

# The DSI host must find the panel driver. Load it first when the host loads by alias.
softdep sun6i_mipi_dsi pre: panel-jadard-jd9365da-h3
# The backlight needs the PWM before the display master starts.
softdep sun4i-drm pre: pwm-sun4i
