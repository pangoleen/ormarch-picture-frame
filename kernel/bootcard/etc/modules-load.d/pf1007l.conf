# /etc/modules-load.d/pf1007l.conf - PF1007L photo frame, stock linux-armv7 7.2.10-1.
# systemd-modules-load loads these lines in this order, before udev finishes.
# DRAFT: not run on the frame.

# 1. USB debug link first: CDC ECM network (usb0) + CDC ACM serial (ttyGS0) on the USB-C port.
#    The musb controller, its PHY and the UDC core are built into the kernel.
g_cdc

# 2. SoC temperature sensor (A33 "ths"). Without it the cpu-thermal zone has no sensor and
#    Linux cannot slow the CPU when it is hot. udev also loads it by alias.
sun4i-gpadc-iio

# 3. Backlight PWM. pwm-backlight is built in and waits for this provider.
pwm-sun4i

# 4. Panel driver (out-of-tree, in updates/). Loaded before the DSI host, so that the
#    panel binds without a module alias lookup.
panel-jadard-jd9365da-h3

# 5. Display pipeline. udev also loads these by their device-tree alias. The list makes
#    the order fixed: DSI host, parts, then the master (the first mode set is here).
sun6i_mipi_dsi
sun4i-frontend
sun4i-backend
sun6i_drc
sun4i-tcon
sun4i-drm

# 6. GPU (Mali-400, render only; it does not drive the screen).
lima

# 7. Compressed swap. The stock kernel has only the lzo and lzo-rle compressors.
zram

# Not here on purpose:
#  - aic8800_bsp / aic8800_fdrv (Wi-Fi): udev loads them when the SDIO card appears.
#    A forced load with no card fails after 2 s with "No such device".
#  - silead (touch), st_accel_i2c (accelerometer, node disabled), audio: udev loads them by alias.
